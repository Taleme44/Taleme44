<script>
(()=>{'use strict';
const $=q=>document.querySelector(q),app=$('#app');
const secNames=['Familie & Kontakt','Kinder & Haushalt','Wohnen & Umgebung','Alltag & Aufgaben','Wünsche & Profil','BA & Vertrag'];
const BA_MAP={apFirst:'4',apLast:'5',apDob:'6',apNation:'7',apGender:'8',apEntry:'9',street:'10',houseNo:'11',zip:'12',city:'13',phone:'14',mail:'15',p1first:'16',p1last:'17',p1nation:'18',single:'19',p2first:'20',p2last:'21',p2nation:'22',relation:'23',kids:'24',apContractStart:'25',apContractEnd:'25',apRelated:'26',germanMotherTongue:'27',euMember:'28',apGermanA1:'29',apCultural:'30',course70:'31',courseProvider:'32',courseTravel:'33',familyConnection:'34',careDuties:'35',outsideWork:'36',overLimit:'37',freeTime:'38',paidHoliday:'39',roomOwn:'40',freeFood:'41',sharedMeals:'42',pocket280:'43',insured:'44',insuranceProvider:'45',religiousPractice:'46',apVisa:'47',apMediated:'48',apMediator:'49',apInitiative:'50',apRecruited:'51',apAgencySupport:'52',currentAP:'53',oldAPEnd:'54',oldAPFirst:'55',oldAPLast:'56',oldAPDob:'57',oldAPNation:'58',contractAttached:'59',baLeaflet:'60',baRemark:'61',baSignPlace:'62',baSignDate:'63'};
const raw=[];let active=[],state={phase:'welcome',values:{},stepId:'',autoAudio:true,visited:{},email:'',error:''};
const txt=(id,label,required=false,extra={})=>({id,label,type:'text',required,...extra});
const dat=(id,label,required=false)=>({id,label,type:'date',required});
const rad=(id,label,options=['Ja','Nein'],required=false,extra={})=>({id,label,type:'radio',options,required,...extra});
const yes=(id,label,required=false)=>rad(id,label,['Ja','Nein','Noch nicht bekannt'],required);
const sel=(id,label,options,required=false)=>({id,label,type:'select',options,required});
const area=(id,label,required=false)=>({id,label,type:'textarea',required});
const num=(id,label,required=false,extra={})=>({id,label,type:'number',required,...extra});
const check=(id,label)=>({id,label,type:'check',required:false});
const multi=(id,label,options)=>({id,label,type:'multi',options,required:false});
function add(sec,id,title,desc,fields,extra={}){if(fields.length>3)throw Error('Too many fields: '+id);raw.push({sec,id,title,desc,fields,...extra})}
const opt=(id)=>String(state.values[id]??'').trim();
// 1: Adults & contact; official BA references 10-23 & family questionnaire.
add(0,'one-name','Wie heißt Elternteil 1?','Bitte gebt den Vor- und Nachnamen ein.',[txt('p1first','Vorname',true,{ba:'16'}),txt('p1last','Nachname',true,{ba:'17'})]);
add(0,'single','Seid ihr alleinerziehend?','Wenn du allein erziehst, überspringen wir automatisch Elternteil 2.',[rad('single','Familienform',['Ja, ich bin alleinerziehend','Nein, wir sind zwei Elternteile'],true,{ba:'19, 23'})]);
add(0,'one-details','Ein paar Angaben zu Elternteil 1','Für Familienprofil und BA-Fragebogen.',[txt('p1nation','Staatsangehörigkeit',true,{ba:'18'}),dat('p1dob','Geburtsdatum (freiwillig)'),txt('p1job','Beruf (freiwillig)')]);
add(0,'two-name','Wie heißt Elternteil 2?','Bitte gebt den Vor- und Nachnamen ein.',[txt('p2first','Vorname',true,{ba:'20'}),txt('p2last','Nachname',true,{ba:'21'})],{when:()=>opt('single')!=='Ja, ich bin alleinerziehend'});
add(0,'two-details','Angaben zu Elternteil 2','Nur bei Familien mit zwei Elternteilen.',[txt('p2nation','Staatsangehörigkeit',true,{ba:'22'}),dat('p2dob','Geburtsdatum (freiwillig)'),txt('p2job','Beruf (freiwillig)')],{when:()=>opt('single')!=='Ja, ich bin alleinerziehend'});
add(0,'relation','Wie lebt ihr zusammen?','Diese Angabe wird für das BA-Formular benötigt.',[sel('relation','Familienverhältnis',['Ehepartner/in','Lebenspartner/in','Unverheiratetes Paar'],true,{ba:'19, 23'})],{when:()=>opt('single')!=='Ja, ich bin alleinerziehend'});
add(0,'address-1','Wie lautet eure Straße?','Bitte gebt die Wohnanschrift eurer Gastfamilie ein.',[txt('street','Straße',true,{ba:'10'}),txt('houseNo','Hausnummer',true,{ba:'11'})]);
add(0,'address-2','Wo wohnt eure Familie?','Postleitzahl und Wohnort werden auch für den Vertrag benötigt.',[txt('zip','Postleitzahl',true,{ba:'12',inputmode:'numeric'}),txt('city','Wohnort',true,{ba:'13'})]);
add(0,'contact','Wie erreichen wir euch?','Bitte gebt eure Telefonnummer und Kontakt-E-Mail ein.',[txt('phone','Telefonnummer',true,{type:'tel',ba:'14'}),txt('mail','E-Mail',true,{type:'email',ba:'15'})]);
add(0,'one-extra','Weitere Angaben zu Elternteil 1','Diese Angaben aus dem ergänzenden Familienfragebogen sind freiwillig.',[rad('p1athome','Elternteil 1 tagsüber zu Hause?'),txt('p1religion','Konfession Elternteil 1 (freiwillig)')],{optional:true});
add(0,'two-extra','Weitere Angaben zu Elternteil 2','Diese Angaben aus dem ergänzenden Familienfragebogen sind freiwillig.',[rad('p2athome','Elternteil 2 tagsüber zu Hause?'),txt('p2religion','Konfession Elternteil 2 (freiwillig)')],{when:()=>opt('single')!=='Ja, ich bin alleinerziehend',optional:true});
add(0,'agencies','Zuständige Behörden','Hilft später beim Visum und der Behördenkommunikation.',[txt('arbeitsagentur','Zuständige Arbeitsagentur (wenn bekannt)'),txt('auslaenderamt','Zuständige Ausländerbehörde (wenn bekannt)')]);
// 2 children & household.
add(1,'children-count','Wie viele Kinder unter 18 wohnen bei euch?','Für ein Au-pair muss mindestens ein minderjähriges Kind im Haushalt leben.',[num('kids','Anzahl der Kinder unter 18',true,{min:1,max:12,ba:'24'})]);
add(1,'household-others','Leben weitere Personen im Haushalt?','Bitte nennt nur Personen, die für das Zusammenleben mit dem Au-pair relevant sind.',[rad('otherPersons','Weitere Personen?'),txt('otherPersonsDetails','Wenn ja, wer?')]);
add(1,'other-helpers','Habt ihr weitere Unterstützung?','Zum Beispiel Haushaltshilfe oder Kinderbetreuung.',[rad('helpers','Weitere Hilfskräfte?'),txt('helpersDetails','Wenn ja, welche?')]);
add(1,'family-language','Welche Sprachen sprecht ihr?','Die Sprachsituation ist auch für das BA-Verfahren wichtig.',[yes('germanMotherTongue','Ist Deutsch Muttersprache in eurer Familie?',true),txt('otherLanguages','Weitere gesprochene Sprachen')]);
add(1,'family-eu','Staatsangehörigkeit und Au-pair','Mindestens ein erwachsenes Familienmitglied mit deutscher, EU-/EWR- oder Schweizer Staatsangehörigkeit?', [yes('euMember','Trifft diese Aussage zu?',true)]);
// 3 home.
add(2,'home-type','Wie wohnt eure Familie?','So kann sich ein Au-pair euer Zuhause vorstellen.',[sel('urban','Wohnlage',['Großstadt','Stadt','Kleinstadt','Dorf']),sel('housetype','Wohnform',['Haus','Wohnung'])]);
add(2,'home-rooms','Wie groß ist euer Zuhause?','Die Anzahl der Zimmer einschließlich Badezimmer ist optional.',[num('rooms','Anzahl der Zimmer (einschließlich Bad)',false,{min:1,max:99}),txt('bigcity','Nächste größere Stadt')]);
add(2,'home-distances','Wie ist eure Umgebung?','Entfernungen können ungefähr angegeben werden.',[txt('bigcityDistance','Entfernung zur nächsten Großstadt'),txt('shoppingDistance','Entfernung zu Einkaufsmöglichkeiten')]);
add(2,'home-aupair','Wie wohnt euer Au-pair bei euch?','Ein eigenes Zimmer im Haushalt der Gastfamilie gehört zu den BA-Angaben.',[yes('roomOwn','Eigenes Zimmer innerhalb der Familienwohnung?',true),rad('bathOwn','Eigenes Bad?'),rad('tvOwn','Eigenes Fernsehgerät?')]);
add(2,'transport','Wie kommt das Au-pair zur Sprachschule?','Bitte nennt Verkehrsmittel und Entfernung zum nächsten Sprachkurs.',[txt('languageDistance','Entfernung zum nächsten Sprachkurs'),txt('transport','Verfügbare Verkehrsmittel')]);
add(2,'pets','Gibt es Haustiere?','Eine kurze Angabe genügt.',[rad('pets','Haustiere?'),txt('petsType','Wenn ja, welche?')]);
add(2,'smoking','Wird in eurem Haushalt geraucht?','Wichtig für die Auswahl eines passenden Au-pairs.',[rad('smokers','Wird bei euch geraucht?'),rad('aupairSmoke','Darf das Au-pair bei euch rauchen?')]);
add(2,'diet','Wie esst ihr als Familie?','Besondere Wünsche können später auch im Match besprochen werden.',[rad('vegetarian','Lebt eure Familie vegetarisch?'),area('foodNotes','Ernährung / Besonderheiten (freiwillig)')]);
add(2,'special-needs','Gibt es wichtige Besonderheiten?','Freiwillig: Bitte nur Angaben, die für das Zusammenleben oder die Aufgaben des Au-pairs wirklich nötig sind.',[area('specialNeeds','Besonderheiten oder Unterstützungsbedarf (freiwillig)')],{optional:true});
// 4 tasks and BA working conditions.
add(3,'hours','Wann braucht ihr Unterstützung?','Ihr könnt mehrere Zeiten auswählen.',[multi('helpTimes','Übliche Tageszeiten',['Vormittags','Nachmittags','Abends']),txt('dayOff','Bevorzugter freier Tag')]);
add(3,'daily-tasks','Welche Aufgaben sind vorgesehen?','Nur Kinderbetreuung und leichte Hausarbeit im Rahmen eines Au-pair-Verhältnisses.',[multi('tasks','Vorgesehene Aufgaben',['Kinderbetreuung','Leichte Hausarbeit','Einfache Mahlzeiten','Einkaufen','Bügeln'])]);
add(3,'driver','Soll das Au-pair Auto fahren?','Eine Führerscheinanforderung ist optional.',[rad('driver','Führerschein erwünscht?'),txt('drivingNotes','Weitere Hinweise zum Fahren')]);
add(3,'household-association','Gehört das Au-pair zur Familie?','Die Bundesagentur fragt ausdrücklich nach Familienanschluss.',[yes('familyConnection','Mithilfe im Haushalt mit Familienanschluss?',true)]);
add(3,'care','Sind pflegerische Aufgaben vorgesehen?','Die BA fragt nach Kranken-/Altenpflege. Solche Aufgaben gehören nicht zur regulären Au-pair-Tätigkeit.',[yes('careDuties','Pflegebedürftige Personen betreuen?',true)]);
add(3,'family-business','Soll das Au-pair andere Arbeiten ausführen?','Zum Beispiel Tätigkeiten im Familienbetrieb.',[yes('outsideWork','Andere Arbeiten, z. B. im Familienbetrieb?',true)]);
add(3,'daily-hours','Wie lange soll das Au-pair helfen?','Die BA fragt, ob mehr als 6 Stunden täglich oder mehr als 30 Wochenstunden einschließlich Babysitting vorgesehen sind.',[yes('overLimit','Mehr als 6 Stunden täglich oder 30 Stunden wöchentlich?',true)]);
add(3,'free-time','Welche Freizeit ist vorgesehen?','Mindestens 1,5 freie Tage pro Woche, davon monatlich ein Sonntag, und vier freie Abende.',[yes('freeTime','Sind diese freien Zeiten gewährleistet?',true)]);
add(3,'holiday','Wie ist der Urlaub geregelt?','BA-Frage: bezahlter Urlaub, in der Regel vier Wochen pro Jahr.',[yes('paidHoliday','Bekommt das Au-pair den zustehenden bezahlten Urlaub?',true)]);

function getSteps(){const list=[];for(const q of raw){if(q.sec===1 && q.id==='household-others'){let n=Math.min(12,Math.max(0,parseInt(opt('kids')||'0',10)||0));for(let i=0;i<n;i++){list.push({sec:1,id:`child-${i+1}`,title:`Erzählt uns von Kind ${i+1}`,desc:'Vorname, Geburtsdatum und Betreuung bzw. Schule.',fields:[txt(`child${i+1}name`,'Vorname des Kindes',true),dat(`child${i+1}birth`,'Geburtsdatum',true),sel(`child${i+1}place`,'Kindergarten oder Schule?',['Kindergarten','Schule','Zu Hause','Anderes'])]})}}if(!q.when||q.when())list.push(q)}return list}

function sectionProgress(){const list=getSteps().filter(x=>x.sec<5);const handled=list.filter(q=>state.visited[q.id]).length;const progress=list.length?Math.round(100*handled/list.length):0;return {handled,total:list.length,progress}}
function getActive(){active=getSteps();let i=active.findIndex(q=>q.id===state.stepId);if(i<0)i=0;state.stepId=active[i]?.id??'';return {i,q:active[i]}}
function fieldHTML(f){let value=state.values[f.id];const hint=f.hint?`<div class="fieldhint">${esc(f.hint)}</div>`:'';
let out=`<div class="field ${f.type==='textarea'||f.type==='multi'?'wide':''}">`;

else if(f.type==='textarea')out+=`<textarea id="f-${esc(f.id)}" data-field="${esc(f.id)}" class="textarea" placeholder="Hier könnt ihr eure Antwort eingeben">${esc(value)}</textarea>`;
else {const type=f.type||'text';out+=`<input id="f-${esc(f.id)}" data-field="${esc(f.id)}" class="input" type="${esc(type)}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} ${f.inputmode?`inputmode="${f.inputmode}"`:''} value="${esc(value)}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'Bitte eingeben')}">`}

let preferredVoiceName='';
try{preferredVoiceName=localStorage.getItem('agenturAkkusVoiceNameV2')||''}catch{}
function germanVoices(){
  if(!('speechSynthesis' in window))return [];
  return window.speechSynthesis.getVoices().filter(v=>/^de([_-]|$)/i.test(v.lang||''));
}
function voiceScore(v){
  const n=v.name.toLowerCase();let score=(v.lang||'').toLowerCase()==='de-de'?60:30;
  if(/natural|neural|premium|enhanced|hochwertig|high quality/i.test(n))score+=100;
  if(/google/i.test(n))score+=35;
  if(/microsoft/i.test(n))score+=25;
  if(/anna|petra|katja|siri|helena|marlene|viktoria|klara|isabella|seraphina/i.test(n))score+=18;
  if(/compact|basic|espeak|robot|low quality/i.test(n))score-=100;
  if(v.default)score+=8;
  return score;
}
function voiceOptionsHTML(){
  const vv=germanVoices().slice().sort((a,b)=>voiceScore(b)-voiceScore(a));
  if(!vv.length)return '<option value="">Automatisch – deutsche Browserstimme</option>';
  return '<option value="">Automatisch – beste verfügbare Stimme</option>'+vv.map(v=>'<option value="'+esc(v.name)+'" '+(preferredVoiceName===v.name?'selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');
}
function voicePanelHTML(){return '<div class="voicepanel" id="voicePanel" hidden><label for="voiceSelect" class="fieldlegend">Deutsche Stimme auswählen</label><select class="select" id="voiceSelect">'+voiceOptionsHTML()+'</select><p class="optionhint">Kostenlos: Wir verwenden die verfügbaren Stimmen deines Geräts. Eine natürlichere Stimme wird bevorzugt, wenn sie vorhanden ist.</p></div>'}

function validate(q){for(const f of q.fields){if(!f.required)continue;const v=state.values[f.id];if(v===undefined||v===null||String(v).trim()===''){return `Bitte füllt das Feld „${f.label}“ aus.`}if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))return 'Bitte gebt eine gültige E-Mail-Adresse ein.';if(f.id==='kids'&&(+v<1||+v>12))return 'Bitte gebt eine Anzahl zwischen 1 und 12 an.'}
if(q.id==='contact'){let v=opt('mail');if(!/^\S+@\S+\.\S+$/.test(v))return 'Bitte gebt eine gültige Kontakt-E-Mail ein.'}return ''}
function countAnswered(){return Object.entries(state.values).filter(([k,v])=>v!==''&&v!=null&&(Array.isArray(v)?v.length>0:v!==false)).length}
function family(){const last=opt('p1last');return last?'Familie '+last:'eure Familie'}
function summaryData(){const sections=secNames.map(name=>({name,rows:[]}));const seen=new Set();getSteps().forEach(step=>{step.fields.forEach(f=>{if(seen.has(f.id))return;seen.add(f.id);let v=state.values[f.id];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;v=Array.isArray(v)?v.join(', '):v===true?'Ja':v===false?'Nein':String(v);sections[step.sec].rows.push({label:f.label+((BA_MAP[f.id]||f.ba)?` (BA ${BA_MAP[f.id]||f.ba})`:''),value:v,key:f.id})})});return sections}

function render(){if(state.phase==='welcome')renderWelcome();else if(state.phase==='register')renderReg();else if(state.phase==='form')renderForm();else renderDone();window.scrollTo({top:0,behavior:'instant'})}
function speakCurrent(){
  if(!('speechSynthesis' in window))return;
  const q=state.phase==='form'?getActive().q:null;
  let text='';
  if(state.phase==='welcome')text='Herzlich willkommen bei Agentur Akkus. Bitte füllt den Gasteltern-Fragebogen aus.';
  else if(state.phase==='register')text='Anmeldung. Gebt bitte eure E-Mail-Adresse ein und wählt ein Passwort.';
  else if(q)text=q.title;
  else if(state.phase==='done')text='Vielen Dank. Euer Familienprofil ist erfasst.';
  if(!text)return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE';u.rate=.90;u.pitch=1.02;
    const voices=germanVoices();
    const selected=voices.find(v=>v.name===preferredVoiceName)||voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
    if(selected)u.voice=selected;
    window.speechSynthesis.speak(u);
  }catch(e){console.warn('Sprachausgabe nicht verfügbar',e)}
}
function next(){const {i,q}=getActive();let error=validate(q);if(error){state.error=error;render();return}state.error='';state.visited[q.id]=true;active=getSteps();let pos=active.findIndex(s=>s.id===q.id);if(pos===-1)pos=i;let next=active[pos+1];if(next){state.stepId=next.id;if(q.sec===4&&next.sec===5){state.phase='done'}else state.phase='form'}else state.phase='done';render();if(state.autoAudio)speakCurrent()}
function skip(){const {q}=getActive();state.error='';state.visited[q.id]=true;active=getSteps();let i=active.findIndex(s=>s.id===q.id);state.stepId=active[i+1]?.id||q.id;state.phase=active[i+1]?'form':'done';render();if(state.autoAudio)speakCurrent()}
function back(){const {i}=getActive();if(i>0){state.stepId=active[i-1].id;state.error='';render();if(state.autoAudio)speakCurrent()}}
function saveLocal(){try{localStorage.setItem('agenturAkkusDemoAnswersV1',JSON.stringify({values:state.values,stepId:state.stepId,visited:state.visited,email:state.email,date:new Date().toISOString()}));alert('Zwischenstand wurde nur in diesem Browser gespeichert.')}catch(e){alert('Speichern ist in diesem Browser nicht möglich. Bitte exportiert die Antworten.')}}
function exportJSON(){const contents={hinweis:'Lokale Demo, keine amtliche Einreichung',erstellt:new Date().toISOString(),familie:family(),daten:state.values,abschnitte:summaryData()};let b=new Blob([JSON.stringify(contents,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='Agentur-Akkus-Gasteltern-Fragebogen.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function printOut(){const sections=summaryData();$('#printReport').innerHTML=`<h1>Agentur Akkus – Gasteltern-Fragebogen</h1><p>${esc(family())} · Ausgefüllt am ${new Date().toLocaleDateString('de-DE')} · Entwurf, nicht unterschrieben</p>${sections.map(s=>s.rows.length?`<section><h2>${esc(s.name)}</h2><table>${s.rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.value)}</td></tr>`).join('')}</table></section>`:'').join('')}<p>Dies ist eine interne Datenübersicht, kein amtliches BA-Formular. Ort, Datum und echte Unterschrift sind für die amtliche Einreichung gesondert erforderlich.</p>`;window.print()}
function restore(){try{let x=JSON.parse(localStorage.getItem('agenturAkkusDemoAnswersV1')||'null');if(!x||!x.values)return false;state.values=x.values;state.visited=x.visited||{};state.email=x.email||'';state.stepId=x.stepId||'one-name';state.phase='form';return true}catch{return false}}
app.addEventListener('input',e=>{let id=e.target.dataset.field;if(id){state.values[id]=e.target.type==='checkbox'?e.target.checked:e.target.value}});
app.addEventListener('change',e=>{if(e.target.id==='voiceSelect'){preferredVoiceName=e.target.value;try{localStorage.setItem('agenturAkkusVoiceNameV2',preferredVoiceName)}catch{}speakCurrent();return}let id=e.target.dataset.field;if(id)state.values[id]=e.target.type==='checkbox'?e.target.checked:e.target.value});
app.addEventListener('submit',e=>{if(e.target.id!=='regForm')return;e.preventDefault();const email=$('#regEmail').value.trim(),password=$('#regPassword').value;state.error='';if(!/^\S+@\S+\.\S+$/.test(email))state.error='Bitte gib eine gültige E-Mail-Adresse ein.';else if(password.length<8)state.error='Das Demo-Passwort sollte mindestens acht Zeichen haben.';if(state.error){render();return}state.email=email;state.values.mail=email;state.phase='form';state.stepId='one-name';state.visited={};render();if(state.autoAudio)speakCurrent()});
app.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const id=choice.dataset.choice,val=choice.dataset.option,field=getActive().q.fields.find(f=>f.id===id);if(field?.type==='multi'){let arr=Array.isArray(state.values[id])?[...state.values[id]]:[];if(arr.includes(val))arr=arr.filter(x=>x!==val);else arr.push(val);state.values[id]=arr}else state.values[id]=val;state.error='';render();return}
const b=e.target.closest('button');if(!b)return;let id=b.id;switch(id){case 'audioToggle':state.autoAudio=!state.autoAudio;try{window.speechSynthesis.cancel()}catch{}render();if(state.autoAudio)speakCurrent();break;case 'startWelcome':state.phase='register';render();if(state.autoAudio)speakCurrent();break;case 'readQuestion':speakCurrent();break;case 'voiceSettings':{const panel=app.querySelector('#voicePanel');if(panel){panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden){const sel=app.querySelector('#voiceSelect');if(sel)sel.innerHTML=voiceOptionsHTML()}}break;}case 'goNext':next();break;case 'goBack':back();break;case 'skipQuestion':skip();break;case 'saveLocal':saveLocal();break;case 'editForm':state.phase='form';state.stepId='one-name';render();break;case 'openBA':state.phase='form';state.stepId='aupair-identity';render();if(state.autoAudio)speakCurrent();break;case 'exportJSON':exportJSON();break;case 'printPDF':printOut();break;case 'resetAll':if(confirm('Alle eingegebenen Demo-Daten löschen?')){try{localStorage.removeItem('agenturAkkusDemoAnswersV1')}catch{}state={phase:'welcome',values:{},stepId:'',autoAudio:true,visited:{},email:'',error:''};render()}break;}});
try{if(localStorage.getItem('agenturAkkusDemoAnswersV1')&&confirm('Es gibt einen lokal gespeicherten Zwischenstand. Möchtet ihr ihn fortsetzen?'))restore()}catch{}
render();
})();
</script>
</body></html>
