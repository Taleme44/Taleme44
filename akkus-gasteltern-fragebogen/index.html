function sectionProgress(){const list=getSteps().filter(x=>x.sec<5);const handled=list.filter(q=>state.visited[q.id]).length;const progress=list.length?Math.round(100*handled/list.length):0;return {handled,total:list.length,progress}}

let preferredVoiceName='';
try{preferredVoiceName=localStorage.getItem('agenturAkkusVoiceNameV2')||''}catch{}
function germanVoices(){
  if(!('speechSynthesis' in window))return [];
  return window.speechSynthesis.getVoices().filter(v=>/^de([_-]|$)/i.test(v.lang||''));
}
function voiceScore(v){
  const n=(v.name||'').toLowerCase();
  let score=(v.lang||'').toLowerCase()==='de-de'?60:30;
  // Bevorzugt eine sanfte, möglichst natürlich klingende kostenlose Frauenstimme.
  if(/natural|neural|premium|enhanced|erweitert|hochwertig|high quality/i.test(n))score+=130;
  if(/anna|petra|katja|siri|helena|marlene|viktoria|klara|isabella|seraphina|sophia|female|frau|weiblich/i.test(n))score+=95;
  if(/google|microsoft/i.test(n))score+=30;
  if(/yannick|markus|martin|daniel|stefan|thomas|male|männlich/i.test(n))score-=45;
  if(/compact|basic|espeak|robot|low quality/i.test(n))score-=120;
  if(v.default)score+=8;
  return score;
}
function voiceOptionsHTML(){
  const vv=germanVoices().slice().sort((a,b)=>voiceScore(b)-voiceScore(a));
  if(!vv.length)return '<option value="">Automatisch – deutsche Stimme (kostenlos)</option>';
  return '<option value="">Automatisch – natürliche Frauenstimme (kostenlos)</option>'+vv.map(v=>'<option value="'+esc(v.name)+'" '+(preferredVoiceName===v.name?'selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');
}

function validate(q){for(const f of q.fields){if(!f.required)continue;const v=state.values[f.id];if(v===undefined||v===null||String(v).trim()===''){return `Bitte füllt das Feld „${f.label}“ aus.`}if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))return 'Bitte gebt eine gültige E-Mail-Adresse ein.';if(f.id==='kids'&&(+v<1||+v>12))return 'Bitte gebt eine Anzahl zwischen 1 und 12 an.'}

function speakCurrent(){
  if(!('speechSynthesis' in window))return;
  const q=state.phase==='form'?getActive().q:null;
  let text='';
  if(state.phase==='welcome')text='Herzlich willkommen bei Agentur Akkus. Bitte füllt den Gasteltern-Fragebogen aus.';
  else if(state.phase==='register')text='Anmeldung. Gebt bitte eure E-Mail-Adresse ein und wählt ein Passwort.';
  else if(q)text=q.title;
  else if(state.phase==='done')text='Vielen Dank. Euer Familienprofil ist erfasst.';
  if(!text)return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE';u.rate=.96;u.pitch=1.0;
    const voices=germanVoices();
    const selected=voices.find(v=>v.name===preferredVoiceName)||voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
    if(selected)u.voice=selected;
    window.speechSynthesis.speak(u);
  }catch(e){console.warn('Sprachausgabe nicht verfügbar',e)}
}

app.addEventListener('submit',e=>{if(e.target.id!=='regForm')return;e.preventDefault();const email=$('#regEmail').value.trim(),password=$('#regPassword').value;state.error='';if(!/^\S+@\S+\.\S+$/.test(email))state.error='Bitte gib eine gültige E-Mail-Adresse ein.';else if(password.length<8)state.error='Das Demo-Passwort sollte mindestens acht Zeichen haben.';if(state.error){render();return}state.email=email;state.values.mail=email;state.phase='form';state.stepId='one-name';state.visited={};render();if(state.autoAudio)speakCurrent()});
app.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const id=choice.dataset.choice,val=choice.dataset.option,field=getActive().q.fields.find(f=>f.id===id);if(field?.type==='multi'){let arr=Array.isArray(state.values[id])?[...state.values[id]]:[];if(arr.includes(val))arr=arr.filter(x=>x!==val);else arr.push(val);state.values[id]=arr}else state.values[id]=val;state.error='';render();return}
const b=e.target.closest('button');if(!b)return;let id=b.id;switch(id){case 'audioToggle':state.autoAudio=!state.autoAudio;try{window.speechSynthesis.cancel()}catch{}render();if(state.autoAudio)speakCurrent();break;case 'startWelcome':state.phase='register';render();if(state.autoAudio)speakCurrent();break;case 'readQuestion':speakCurrent();break;case 'voiceSettings':{const panel=app.querySelector('#voicePanel');if(panel){panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden){const sel=app.querySelector('#voiceSelect');if(sel)sel.innerHTML=voiceOptionsHTML()}}break;}case 'goNext':next();break;case 'goBack':back();break;case 'skipQuestion':skip();break;case 'saveLocal':saveLocal();break;case 'editForm':state.phase='form';state.stepId='one-name';render();break;case 'openBA':state.phase='form';state.stepId='aupair-identity';render();if(state.autoAudio)speakCurrent();break;case 'exportJSON':exportJSON();break;case 'printPDF':printOut();break;case 'resetAll':if(confirm('Alle eingegebenen Demo-Daten löschen?')){try{localStorage.removeItem('agenturAkkusDemoAnswersV1')}catch{}state={phase:'welcome',values:{},stepId:'',autoAudio:true,visited:{},email:'',error:''};render()}break;}});
try{if(localStorage.getItem('agenturAkkusDemoAnswersV1')&&confirm('Es gibt einen lokal gespeicherten Zwischenstand. Möchtet ihr ihn fortsetzen?'))restore()}catch{}
render();
})();
</script>
</body></html>
