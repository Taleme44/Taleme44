<style>

4vw,43px)/1.16 Georgia,serif;letter-spacing:-.03em;margin:0 0 15px;max-width:820px}.question-desc{margin:0 0 20px;color:#697c71;line-height:1.65;font-size:14px}.voice-btn{border:1px solid #d1e1d7;color:var(--green);border-radius:12px;background:#f6faf7;padding:10px 13px;font-weight:750;font-size:13px}.formfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 18px;margin-top:25px}.formfield.wide{grid-column:1/-1}.field-label{font-size:13px;font-weight:740;display:block;margin-bottom:10px}.input,.select,.textarea{width:100%;min-height:49px;background:#fbfcfa;border:1.5px solid #d7e2d9;border-radius:12px;padding:12px 13px;color:var(--ink);outline:none}.textarea{min-height:125px;resize:vertical;line-height:1.55}.input:focus,.textarea:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px #3f8e5c15}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{background:#fff;border:1.5px solid #d8e1d9;border-radius:12px;padding:12px 15px;min-height:45px;font-size:13px;font-weight:680;text-align:left;color:var(--ink)}.choice.selected{background:var(--green);border-color:var(--green);color:#fff}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:7px 0}.warning{background:#fff0ee;color:#9d2626;border:1px solid #eac7c2;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:650;margin:15px 0}.info{border:1px solid #d6e3d9;background:#f4f9f5;border-radius:12px;padding:13px 14px;color:#3e6357;font-size:13px;line-height:1.65;margin:16px 0}.footer-nav{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:19px 30px;background:#fcfdfb}.nav-right{display:flex;align-items:center;gap:9px}.status-foot{text-align:center;margin-top:20px;color:#718278;font-size:12px;line-height:1.7}.readback{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.upload-card{border:1px solid #d9e5dc;background:#fdfefd;border-radius:14px;padding:15px;min-width:0}.upload-card label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.upload-card input{font-size:12px;max-width:100%;margin:10px 0 4px}.upload-card small{display:block;font-size:11px;color:var(--muted)}.upload-card .filename{color:var(--green);font-size:11px;overflow-wrap:anywhere;font-weight:650}.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}.suggestion{padding:8px 11px;border:1px dashed #bed4c8;background:#f4f8f4;color:#285448;border-radius:10px;font-size:12px;max-width:100%}.speech-note{color:#89958d;font-size:11px;margin-top:5px}.mic{background:#fff;border:1px solid #d1ddd2;border-radius:10px;padding:8px 10px;color:var(--green)}.mic.recording{background:#fce9e5;color:#ad3732;border-color:#edb5aa}.text-tools{display:flex;gap:8px;align-items:center;margin-top:8px}.mini-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.internship{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fafdFA;margin:11px 0}.internship-row{display:grid;grid-template-columns:1.2fr .65fr .85fr;gap:8px}.preview-only{background:#f9f1df;border:1px solid #e9d9ae;color:#766131;padding:11px 13px;border-radius:11px;line-height:1.5;font-size:12px;margin:12px 0}.finish{max-width:1000px;margin:0 auto;padding:38px 23px 70px}.finish h1{font:500 43px/1.2 Georgia,serif;margin:13px 0}.finish p{line-height:1.65;color:var(--muted)}.finish-cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:23px 0}.finish-card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px}.finish-card h2{font:600 21px Georgia,serif;margin:0 0 13px}.summary{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.summary-section{border-bottom:1px solid var(--line);padding:20px 25px}.summary-section h3{font-size:15px;color:var(--green);margin:0 0 12px}.summary-row{display:grid;grid-template-columns:220px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #edf1ec;font-size:13px}.summary-row:last-child{border:0}.summary-row b{font-weight:580;color:var(--muted)}.summary-row span{overflow-wrap:anywhere}.secondary-actions{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.legal{padding:18px;border:1px solid #d1dfd3;border-radius:12px;background:#f4f8f4;margin:20px 0;font-size:13px;line-height:1.7}.muted{color:var(--muted)}.emphasis-red{color:#ba3636;font-weight:760}.hidden{display:none}.pill{display:inline-block;background:#eef5ef;padding:5px 10px;border-radius:9px;color:var(--green);font-size:12px;font-weight:700}
@media(max-width:740px){.hero{grid-template-columns:1fr;gap:20px;padding-top:42px}.intro-art{min-height:260px}.art-card{width:85%}.header{padding:0 18px}.formfields,.upload-grid,.finish-cards,.readback{grid-template-columns:1fr}.question-main{padding:22px 20px}.footer-nav{padding:15px 16px}.section-nav{gap:5px}.section-chip{font-size:10px;padding:6px 8px}.summary-row{grid-template-columns:1fr;gap:4px}.internship-row{grid-template-columns:1fr}.header-note{font-size:10px}.footer-nav .btn{padding:11px 13px}.finish h1{font-size:33px}}

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var state={phase:"welcome",index:0,answers:{},files:{},savedAt:""};
var sections=["Kontakt","Aufenthalt & Visum","Schule & Erfahrung","Sprachen","Einsatz & Wünsche","Motivation","Organisation","Dokumente","Abschluss"];
var questions=[];
function add(section,id,title,fields,help,when){questions.push({section:section,id:id,title:title,fields:fields||[],help:help||"",when:when||null});}
function T(id,label,cond,extra){return Object.assign({id:id,label:label,type:"text",show:cond||null},extra||{});}
function N(id,label,cond,extra){return Object.assign({id:id,label:label,type:"number",show:cond||null},extra||{});}
function D(id,label,cond){return {id:id,label:label,type:"date",show:cond||null};}
function C(id,label,options,cond,extra){return Object.assign({id:id,label:label,type:"choice",options:options,show:cond||null},extra||{});}
function M(id,label,options,cond,extra){return Object.assign({id:id,label:label,type:"multi",options:options,show:cond||null},extra||{});}
function S(id,label,options,cond){return {id:id,label:label,type:"select",options:options,show:cond||null};}
function A(id,label,cond,extra){return Object.assign({id:id,label:label,type:"textarea",show:cond||null},extra||{});}
function yes(id,label,cond){return C(id,label,["Ja","Nein"],cond);}
function eq(id,value){return {id:id,eq:value};}
function has(id,value){return {id:id,has:value};}
function any(id,vals){return {id:id,any:vals};}
function visible(when){if(!when)return true;var v=state.answers[when.id];if(when.eq!==undefined)return v===when.eq;if(when.any)return when.any.indexOf(v)>=0;if(when.has)return Array.isArray(v)&&v.indexOf(when.has)>=0;if(when.anyHas)return Array.isArray(v)&&when.anyHas.some(function(x){return v.indexOf(x)>=0;});return true;}
function val(id){return state.answers[id]||"";}

// Kontakt & Identität
add(0,"person","Wie lautet dein Vor- und Nachname?",[T("first","Vorname"),T("last","Nachname")]);
add(0,"birth","Wann bist du geboren?",[D("birthDate","Geburtsdatum")]);
add(0,"nationality","Welche Staatsangehörigkeit hast du?",[T("nationality","Staatsangehörigkeit")]);
add(0,"address","Wo wohnst du derzeit?",[T("country","Land"),T("street","Straße und Hausnummer"),T("postal","Postleitzahl"),T("city","Stadt")]);
add(0,"contact","Wie erreichen wir dich?",[T("phone","Telefonnummer mit Ländervorwahl",null,{inputType:"tel"}),T("email","E-Mail-Adresse",null,{inputType:"email"})]);
add(0,"whatsapp","Benutzt du WhatsApp?",[yes("hasWhatsapp","Hast du WhatsApp?"),C("sameWhatsapp","Ist deine WhatsApp-Nummer dieselbe wie deine Telefonnummer?",["Ja","Nein"],eq("hasWhatsapp","Ja")),T("whatsappNumber","WhatsApp-Nummer mit Ländervorwahl",eq("sameWhatsapp","Nein"),{inputType:"tel"})]);
add(0,"social","Möchtest du Social-Media-Profile angeben?",[T("instagram","Instagram (Profilname oder Link)"),T("facebook","Facebook (Profilname oder Link)"),T("socialOther","LinkedIn oder anderes Profil")],"Alle Social-Media-Angaben sind freiwillig.");

// Aufenthalt & Visum: early routing for people already in Germany
add(1,"germanyNow","Bist du derzeit in Deutschland?",[yes("inGermany","Dein aktueller Aufenthaltsort ist Deutschland?")],"Diese Antwort steuert die folgenden Fragen.");
add(1,"aupairNow","Bist oder warst du in Deutschland als Au-pair tätig?",[C("aupairState","Dein Au-pair-Status",["Ja, derzeit","Ja, früher","Nein"])],"Diese Frage erscheint nur für Bewerber, die bereits in Deutschland sind.",eq("inGermany","Ja"));
add(1,"hostFamily","Bei welcher Gastfamilie bist oder warst du?",[T("hostLast","Nachname der Gastfamilie"),T("hostCity","Stadt"),T("hostStreet","Straße und Hausnummer der damaligen Meldeadresse")],"Diese Angaben sind optional und können bei einer späteren Prüfung deines Aufenthalts wichtig sein.",{id:"aupairState",any:["Ja, derzeit","Ja, früher"]});
add(1,"residence","Besitzt du derzeit einen deutschen Aufenthaltstitel?",[yes("hasPermit","Gültiger Aufenthaltstitel vorhanden?"),C("permitType","Welcher Aufenthaltstitel?",["Au-pair","Studium","Ausbildung","Sprachkurs","Freiwilligendienst","Anderer"],eq("hasPermit","Ja")),T("permitOther","Welcher andere Aufenthaltstitel?",eq("permitType","Anderer")),D("permitUntil","Bis wann ist dein Aufenthaltstitel gültig?",eq("hasPermit","Ja"))],"Bei Nein erscheinen keine Folgefelder zum Titel.",eq("inGermany","Ja"));
add(1,"previousGermany","Warst du früher schon einmal in Deutschland?",[yes("wasGermany","Früherer Aufenthalt in Deutschland?"),T("priorPurpose","Als was / zu welchem Zweck?",eq("wasGermany","Ja")),T("priorVisa","Mit welchem Visum oder Aufenthaltstitel?",eq("wasGermany","Ja"))],"Nur für Bewerber, die derzeit im Ausland leben.",eq("inGermany","Nein"));
add(1,"passport","Besitzt du einen gültigen Reisepass?",[yes("hasPassport","Reisepass vorhanden?"),T("passportNumber","Reisepassnummer (optional)",eq("hasPassport","Ja")),D("passportExpiry","Bis wann ist dein Reisepass gültig?",eq("hasPassport","Ja"))],"Die Passnummer kannst du später ergänzen.");
add(1,"visaCountry","In welchem Land wirst du dein deutsches Visum beantragen?",[T("visaCountry","Land der deutschen Botschaft oder des Konsulats"),T("visaCity","Stadt der Auslandsvertretung (optional)")],"Hier geht es um das Land, in dem du den Antrag stellst – nicht um das Zielland Deutschland.",eq("inGermany","Nein"));
add(1,"embassy","Hast du schon einen Termin bei der deutschen Botschaft oder dem Konsulat?",[yes("embassyDateKnown","Termin vorhanden?"),D("embassyDate","Wann ist dein Termin?",eq("embassyDateKnown","Ja"))],"Bei Nein wird kein Kalender angezeigt.",eq("inGermany","Nein"));
add(1,"volunteerExperience","Hast du bereits einen Freiwilligendienst in Deutschland gemacht?",[yes("priorVolunteer","Schon einmal FSJ, FÖJ oder BFD?"),C("priorVolunteerType","Welchen Freiwilligendienst?",["FSJ","FÖJ","BFD"],eq("priorVolunteer","Ja")),T("priorVolunteerPeriod","Wann und wie lange?",eq("priorVolunteer","Ja"))]);

// Schulbildung, Qualifikationen und Berufspraxis
add(2,"schoolYears","Wie viele Jahre bist du zur Schule gegangen?",[N("schoolYears","Anzahl der Schuljahre",null,{min:0,max:25,placeholder:"z. B. 12"})]);
add(2,"schoolDegree","Welchen Schulabschluss hast du?",[C("degree","Dein höchster Bildungsabschluss",["Noch kein Abschluss","Sekundarstufe","Abitur / Hochschulreife","Berufsausbildung","Studium","Anderer Abschluss"]),T("degreeOther","Welcher andere Abschluss?",eq("degree","Anderer Abschluss")),T("schoolYear","Abschlussjahr (optional)")]);
add(2,"training","Hast du eine Ausbildung oder ein Studium begonnen oder abgeschlossen?",[yes("trainingYes","Ausbildung oder Studium?"),C("trainingKind","Welche Art?",["Berufsausbildung","Studium"],eq("trainingYes","Ja")),T("trainingSubject","Welches Fach oder welchen Beruf?",eq("trainingYes","Ja")),C("trainingStatus","Wie ist der Stand?",["Abgeschlossen","Läuft noch","Abgebrochen"],eq("trainingYes","Ja"))]);
add(2,"work","Hast du bereits gearbeitet?",[yes("worked","Berufserfahrung vorhanden?"),T("workJob","In welchem Beruf oder Bereich?",eq("worked","Ja")),T("workDuration","Wie lange hast du dort gearbeitet?",eq("worked","Ja"))]);
add(2,"internships","Hast du Praktika absolviert?",[yes("didInternships","Praktika vorhanden?")],"Bei Ja kannst du mehrere Praktika mit Bereich, Dauer und Jahr angeben.");
add(2,"volunteering","Hast du dich schon einmal ehrenamtlich engagiert?",[yes("volunteered","Früher ehrenamtlich tätig?"),A("volunteerDetails","Wo, wie lange und was hast du gemacht?",eq("volunteered","Ja"))]);

// Sprachen
add(3,"german","Wie gut sprichst du Deutsch?",[C("germanLevel","Dein aktuelles Deutschniveau",["Keine Kenntnisse","A1","A2","B1","B2","C1 oder höher"])]);
add(3,"germanCertificate","Hast du ein offizielles Deutschzertifikat?",[yes("certYes","Deutsches Sprachzertifikat vorhanden?"),C("certProvider","Von welchem Prüfungsinstitut?",["Goethe-Institut","ÖSD","telc","TestDaF","Anderes"],eq("certYes","Ja")),T("certProviderOther","Welches andere Institut?",eq("certProvider","Anderes")),C("certLevel","Welches Niveau?",["A1","A2","B1","B2","C1","C2"],eq("certYes","Ja")),D("certExam","Wann war deine Prüfung?",eq("certYes","Ja"))]);
add(3,"otherLanguages","Welche weiteren Sprachen sprichst du?",[T("moreLanguages","Sprachen und ungefähres Niveau")]);

// Dienst & Interessen
add(4,"program","Welcher Freiwilligendienst interessiert dich?",[C("program","Dein Wunsch",["Ich bin mir noch nicht sicher","FSJ","FÖJ","BFD"])]);
add(4,"socialFields","In welchen sozialen Bereichen möchtest du dich engagieren?",[M("socialFields","Mehrere Bereiche auswählbar",["Krankenhaus","Seniorenheim","Kindertagesstätte","Schule","Behindertenhilfe","Rettungsdienst","Sport","Kultur"])]);
add(4,"ecoFields","Welche ökologischen Einsatzbereiche interessieren dich?",[M("ecoFields","Mehrere Bereiche auswählbar",["Alle Bereiche","Naturschutz","Landwirtschaft","Tierpflege","Gartenbau","Forstwirtschaft","Umweltbildung"])]);
add(4,"childExperience","Hast du bereits Erfahrungen in der Betreuung von Kindern?",[yes("childExp","Erfahrungen mit Kindern?"),A("childExpDetails","Wo und wie lange?",eq("childExp","Ja"))],"Diese Frage erscheint nur bei Interesse an einer Kindertagesstätte.",has("socialFields","Kindertagesstätte"));
add(4,"careExperience","Hast du Erfahrung mit älteren Menschen oder Menschen mit Behinderungen?",[yes("careExp","Erfahrung in diesem Bereich?"),A("careExpDetails","Welche Aufgaben hast du übernommen?",eq("careExp","Ja"))],"Diese Frage erscheint nur bei Seniorenheim oder Behindertenhilfe.",{id:"socialFields",anyHas:["Seniorenheim","Behindertenhilfe"]});
add(4,"outdoor","Arbeitest du gerne im Freien oder in der Natur?",[C("outdoor","Deine Antwort",["Ja","Nein","Kommt auf die Tätigkeit an"])],"Diese Frage erscheint bei Interesse an einem ökologischen Einsatzbereich.",{id:"ecoFields",anyHas:["Alle Bereiche","Naturschutz","Landwirtschaft","Tierpflege","Gartenbau","Forstwirtschaft","Umweltbildung"]});
add(4,"shifts","Wärst du bereit, im Schichtdienst oder am Wochenende tätig zu sein?",[C("shifts","Schichtdienst",["Ja","Nein","Nach Absprache"]),C("weekend","Wochenende",["Ja","Nein","Nach Absprache"])]);
add(4,"license","Besitzt du einen Führerschein?",[yes("driverYes","Führerschein vorhanden?"),M("driverCategory","Welche Führerscheinklasse?",["Auto","Motorrad","Lkw"],eq("driverYes","Ja"))]);
add(4,"regions","Wo in Deutschland möchtest du deinen Freiwilligendienst machen?",[C("nationwide","Wie flexibel bist du?",["Ganz Deutschland","Bestimmte Region"]),S("stateRegion","Bundesland",["Baden-Württemberg","Bayern","Berlin","Brandenburg","Bremen","Hamburg","Hessen","Mecklenburg-Vorpommern","Niedersachsen","Nordrhein-Westfalen","Rheinland-Pfalz","Saarland","Sachsen","Sachsen-Anhalt","Schleswig-Holstein","Thüringen"],eq("nationwide","Bestimmte Region")),T("wishCity","Bevorzugte Stadt (optional)",eq("nationwide","Bestimmte Region"))],"Je flexibler du bei der Wahl der Region bist, desto mehr Einsatzstellen kommen für dich infrage.");

// Motivation / self assessment
add(5,"whyVolunteer","Warum möchtest du einen Freiwilligendienst machen?",[A("whyVolunteer","Beschreibe deine Motivation",null,{voice:true,suggestions:["Ich möchte anderen Menschen helfen.","Ich möchte neue praktische Erfahrungen sammeln.","Ich möchte mich beruflich orientieren.","Ich möchte Verantwortung übernehmen."]})],"Du kannst Vorschläge anklicken, frei schreiben oder – falls dein Browser es unterstützt – über das Mikrofon diktieren.");

function renderField(f){
if(!visible(f.show))return "";
var v=state.answers[f.id],isMulti=f.type==="multi",wide=f.type==="textarea"||isMulti||f.wide;
var out='<div class="formfield'+(wide?' wide':'')+'"><label class="field-label">'+escapeHtml(localField(f))+'</label>';
if(f.type==="text"||f.type==="number"||f.type==="date"){
var t=f.type==="text"?(f.inputType||"text"):f.type;
out+='<input class="input" type="'+t+'" data-field="'+escapeHtml(f.id)+'" value="'+escapeHtml(v||"")+'"'+(f.min!==undefined?' min="'+f.min+'"':"")+(f.max!==undefined?' max="'+f.max+'"':"")+(f.type==="number"?' step="any"':"")+' placeholder="'+escapeHtml(f.placeholder||"Optional eingeben")+'">';
}
if(f.type==="select"){out+='<select class="select" data-field="'+escapeHtml(f.id)+'"><option value="">'+L('Bitte auswählen (freiwillig)','Choose (optional'))+'</option>'+f.options.map(function(o){return '<option value="'+escapeHtml(localOpt(o))+'"'+(v===o?' selected':'')+'>'+escapeHtml(localOpt(o))+'</option>';}).join("")+'</select>';}
if(f.type==="choice"||isMulti){
var selected=isMulti?(Array.isArray(v)?v:[]):[];
out+='<div class="choices">'+f.options.map(function(o){var checked=isMulti?selected.indexOf(o)>=0:v===o;return '<button type="button" class="choice'+(checked?' selected':'')+'" data-option="'+escapeHtml(localOpt(o))+'" data-choice="'+escapeHtml(f.id)+'" aria-pressed="'+checked+'">'+escapeHtml(localOpt(o))+'</button>';}).join("")+'</div>';
if(f.maxSelect)out+='<div class="hint">Bitte höchstens '+f.maxSelect+' Optionen auswählen. Aktuell: '+selected.length+'</div>';
}
if(f.type==="textarea"){
out+='<textarea class="textarea" id="text-'+escapeHtml(f.id)+'" data-field="'+escapeHtml(f.id)+'" placeholder="'+L('Schreibe deine Antwort ...','Write your answer ...')+'">'+escapeHtml(v||"")+'</textarea>';
if(f.suggestions&&f.suggestions.length){
out+='<div class="hint">Ideen zum Anklicken – deine Antwort kannst du anschließend frei ändern:</div><div class="suggestions">'+f.suggestions.map(function(o){return '<button type="button" class="suggestion" data-append="'+escapeHtml(f.id)+'" data-text="'+escapeHtml(localOpt(o))+'">+ '+escapeHtml(localOpt(o))+'</button>';}).join("")+'</div>';
}
if(f.voice)out+='<div class="text-tools"><button type="button" class="mic" data-mic="'+escapeHtml(f.id)+'" title="Antwort diktieren">'+L('🎙 Antwort sprechen','🎙 Dictate answer')+'</button><span class="speech-note">Nur wenn dein Browser Spracherkennung unterstützt.</span></div>';
}
return out+'</div>';
}

var sectionTags=sections.map(function(n,i){return '<span class="section-chip'+(q.section===i?' active':'')+'">'+escapeHtml(localSection(i))+'</span>';}).join("");
var body=q.id==="documents"?renderFiles():q.fields.map(renderField).join("");
if(q.id==="internships")body+=renderInternships();
if(q.id==="regions")body+='<div class="formfield wide"><div class="warning">Wichtig: Wenn du „Ganz Deutschland“ auswählst, ist deine Auswahl an möglichen Einsatzstellen deutlich größer.</div></div>';
if(q.id==="afterYear")body+='<p class="hint">Deine Pläne sind offen und dürfen sich ändern. Ein späterer Aufenthalt zu einem anderen Zweck benötigt gegebenenfalls eine eigene Erlaubnis.</p>';
app.innerHTML=renderHeader()+'<main class="container"><div class="progress-top"><span>Dein Bewerberprofil · '+escapeHtml(localSection(q.section))+'</span><b>'+percent+' % durchgesehen</b></div><div class="progress-rail"><div class="progress-fill" style="width:'+percent+'%"></div></div><div class="section-nav">'+sectionTags+'</div><section class="question-card"><div class="question-main"><div class="question-counter"><span class="qmark">Schritt '+(idx+1)+' von '+list.length+'</span><span>'+L('Alle Angaben freiwillig','All fields optional')+'</span></div><h1>'+escapeHtml(localTitle(q))+'</h1>'+(q.help?'<p class="question-desc">'+escapeHtml(lang==='en'?'Please answer only the questions that apply to you.':q.help)+'</p>':'')+'<button type="button" class="voice-btn" data-act="speak">'+L('🔊 Frage anhören','🔊 Read question aloud')+'</button><div class="formfields">'+body+'</div></div><div class="footer-nav"><button type="button" class="btn secondary" data-act="back">'+(idx===0?''+L('← Startseite','← Welcome')+'':''+L('← Zurück','← Back')+'')+'</button><div class="nav-right"><button type="button" class="btn link" data-act="skip">'+L('Überspringen','Skip')+'</button><button type="button" class="btn primary" data-act="next">'+(idx>=list.length-1?''+L('Zum Dashboard ✓','Go to dashboard ✓')+'':''+L('Weiter →','Next →')+'')+'</button></div></div></section><div class="status-foot">Noch kein Live-Formular · nichts wird automatisch versendet · alle Angaben optional<br><button type="button" class="btn small link" data-act="save">Zwischenstand auf diesem Gerät speichern</button></div></main>';
}
function readback(){
var blocks=sections.map(function(name,si){var fields=[];questions.filter(function(q){return q.section===si;}).forEach(function(q){q.fields.forEach(function(f){var v=state.answers[f.id];if(v===undefined||v===null||v===""||(Array.isArray(v)&&!v.length))return;fields.push({label:f.label,value:Array.isArray(v)?v.join(", "):v});});});if(si===2&&Array.isArray(state.answers.internshipRows)&&state.answers.internshipRows.length)fields.push({label:"Praktika",value:state.answers.internshipRows.map(function(x){return [x.place,x.year,x.duration].filter(Boolean).join(" · ");}).join("; ")});if(si===7)Object.keys(state.files).forEach(function(k){var d=docs.find(function(x){return x.id===k;});if(d&&state.files[k].length)fields.push({label:d.name,value:state.files[k].join(", ")+" (nur lokal ausgewählt, nicht übermittelt)"});});if(!fields.length)return "";return '<section class="summary-section"><h3>'+escapeHtml(name)+'</h3>'+fields.map(function(x){return '<div class="summary-row"><b>'+escapeHtml(x.label)+'</b><span>'+escapeHtml(x.value)+'</span></div>';}).join("")+'</section>';}).join("");
return blocks||'<div class="summary-section"><p>Du hast bisher keine Angaben eingetragen. Das ist in dieser freiwilligen Vorschau in Ordnung.</p></div>';
}
function renderFinish(){
app.innerHTML=renderHeader()+'<main class="finish"><div class="eyebrow">Dein Fragebogen · Übersicht</div><h1>Vielen Dank für dein Interesse!</h1><p>Hier kannst du deine Angaben prüfen, drucken oder als PDF speichern. In dieser Vorschau wurden deine Daten noch nicht an die Agentur versendet und es gibt noch kein mit einem Server verbundenes Dashboard.</p><div class="secondary-actions"><button type="button" class="btn primary" data-act="print">🖨 Drucken / Als PDF speichern</button><button type="button" class="btn secondary" data-act="download">Antworten als JSON sichern</button><button type="button" class="btn secondary" data-act="edit">Angaben bearbeiten</button><button type="button" class="btn secondary" data-act="save">Lokal speichern</button></div><section class="summary">'+readback()+'</section><div class="finish-cards"><div class="finish-card"><h2>Vermittlungsvertrag</h2><p>Hier kannst du später deinen Vermittlungsvertrag für FSJ, FÖJ und BFD als PDF ansehen, herunterladen und digital unterschreiben. Nach Einrichtung deines Kontos findest du ihn auch in deinem Dashboard.</p><button class="btn secondary" type="button" disabled>PDF ansehen – folgt</button> <button class="btn secondary" type="button" disabled>Online unterschreiben – folgt</button></div><div class="finish-card"><h2>Dein Bewerber-Dashboard</h2><p>In der späteren Live-Version werden dein Profil, deine Dokumente und der Vertragsstatus nach Anmeldung in deinem geschützten Konto verfügbar sein.</p><button class="btn secondary" type="button" disabled>Dashboard – folgt</button></div></div><div class="legal"><strong>Hinweis zur Vermittlung:</strong> Solange Agentur Akkus keine erfolgreiche Vermittlung für dich erreicht hat, berechnet die Agentur keine Vermittlungsgebühr. Die genauen Voraussetzungen und eine etwaige Fälligkeit müssen im gesonderten Vermittlungsvertrag geregelt werden. Ein FSJ, FÖJ oder BFD wird durch eine <strong>Freiwilligendienstvereinbarung</strong> mit dem jeweiligen Träger bzw. den zuständigen Stellen vereinbart, nicht durch einen gewöhnlichen Arbeitsvertrag. Unabhängige Kosten, etwa für Visum, Übersetzungen oder Anreise, können dennoch entstehen.<p style="margin:9px 0 0">Vor dem Live-Einsatz müssen Vermittlungsvertrag, Gebührenregelung, Datenschutz, Speicherfristen und die Dokumentenverwaltung rechtlich und technisch geprüft werden.</p></div><div class="preview-only"><b>Wichtig:</b> Die Schaltfläche „Drucken / Als PDF speichern“ öffnet den Druckdialog. Die Online-Unterschrift, der Vertragsdownload, der sichere Datei-Upload und das Bewerber-Dashboard werden erst in einer späteren Ausbaustufe aktiviert.</div></main>';
}
function render(){if(state.phase==="welcome")renderWelcome();else if(state.phase==="form")renderForm();else renderFinish();window.scrollTo(0,0);}
function nextStep(dir){stopSpeech();var list=activeQuestions();if(dir<0&&state.index<=0){state.phase="welcome";render();return;}state.index+=dir;if(state.index<0)state.index=0;if(state.index>=list.length){state.phase="finish";render();return;}render();}
function saveLocal(){try{localStorage.setItem("akkus_freiwilligendienst_draft_v1",JSON.stringify({answers:state.answers,index:state.index,at:new Date().toISOString()}));alert("Dein Text-Zwischenstand wurde nur auf diesem Gerät gespeichert. Dateien sind nicht gespeichert oder hochgeladen.");}catch(e){alert("Lokales Speichern ist hier nicht verfügbar.");}}
function downloadJSON(){var blob=new Blob([JSON.stringify({hinweis:"Vorschau – nicht an die Agentur übermittelt",answers:state.answers},null,2)],{type:"application/json;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="Agentur-Akkus-Freiwilligendienst-Bewerbung.json";a.click();setTimeout(function(){URL.revokeObjectURL(url);},1200);}
var currentRecognizer=null;
function speakToField(id,button){var Speech=window.SpeechRecognition||window.webkitSpeechRecognition; if(!Speech){alert("Die Spracherkennung ist in diesem Browser nicht verfügbar. Bitte benutze die Diktierfunktion deiner Tastatur oder schreibe den Text.");return;}
try{if(currentRecognizer){currentRecognizer.stop();currentRecognizer=null;}var rec=new Speech();currentRecognizer=rec;rec.lang="de-DE";rec.interimResults=false;rec.maxAlternatives=1;button.classList.add("recording");button.textContent="● Aufnahme läuft";rec.onresult=function(e){var text=e.results[0][0].transcript;var old=String(state.answers[id]||"");state.answers[id]=old?(old.trim()+" "+text):text;var field=document.getElementById("text-"+id);if(field)field.value=state.answers[id];};rec.onerror=function(e){console.warn("Diktat:",e.error);};rec.onend=function(){button.classList.remove("recording");button.textContent="🎙 Antwort sprechen";currentRecognizer=null;};rec.start();}catch(e){alert("Mikrofon konnte nicht gestartet werden. Bitte erlaube die Aufnahme oder benutze die Tastatur.");}}
app.addEventListener("input",function(e){var id=e.target.getAttribute("data-field");if(id)setAnswer(id,e.target.value);var index=e.target.getAttribute("data-intern");if(index!==null){var arr=state.answers.internshipRows||[];if(arr[Number(index)])arr[Number(index)][e.target.getAttribute("data-intern-field")]=e.target.value;}});
app.addEventListener("change",function(e){var id=e.target.getAttribute("data-field");if(id){setAnswer(id,e.target.value);clearDependent();render();}var fileId=e.target.getAttribute("data-file");if(fileId){state.files[fileId]=Array.from(e.target.files||[]).map(function(f){return f.name;});render();}});
app.addEventListener("click",function(e){
var choice=e.target.closest("[data-choice]");if(choice){var id=choice.getAttribute("data-choice"),opt=choice.getAttribute("data-option");var q=current();var field=q.fields.find(function(f){return f.id===id;});if(!field)return;if(field.type==="multi"){var a=Array.isArray(state.answers[id])?state.answers[id].slice():[];var pos=a.indexOf(opt);if(pos>=0)a.splice(pos,1);else {if(opt==="Alle Bereiche")a=["Alle Bereiche"];else {a=a.filter(function(x){return x!=="Alle Bereiche";});if(field.maxSelect&&a.length>=field.maxSelect){alert("Bitte wähle höchstens "+field.maxSelect+" Optionen.");return;}a.push(opt);}}setAnswer(id,a);}else setAnswer(id,opt);clearDependent();render();return;}
var sug=e.target.closest("[data-append]");if(sug){var id=sug.getAttribute("data-append"),text=sug.getAttribute("data-text"),prev=String(state.answers[id]||"");setAnswer(id,prev?(prev.trim()+" "+text):text);var area=document.getElementById("text-"+id);if(area){area.value=state.answers[id];area.focus();}return;}
var mic=e.target.closest("[data-mic]");if(mic){speakToField(mic.getAttribute("data-mic"),mic);return;}
var rm=e.target.closest("[data-remove-intern]");if(rm){var i=Number(rm.getAttribute("data-remove-intern"));var arr=state.answers.internshipRows||[];arr.splice(i,1);render();return;}
var btn=e.target.closest("[data-act]");if(!btn)return;var act=btn.getAttribute("data-act");
if(act==="start"){state.phase="form";state.index=0;render();}
else if(act==="next")nextStep(1);
else if(act==="skip")nextStep(1);
else if(act==="back")nextStep(-1);
else if(act==="speak")speakCurrent();
else if(act==="save")saveLocal();
else if(act==="print")window.print();
else if(act==="download")downloadJSON();
else if(act==="edit"){state.phase="form";state.index=0;render();}
else if(act==="addIntern"){var arr=state.answers.internshipRows||[];if(arr.length>=10){alert("Maximal 10 Praktika in der Vorschau.");return;}arr.push({place:"",year:"",duration:""});state.answers.internshipRows=arr;render();}
});
try{var old=localStorage.getItem("akkus_freiwilligendienst_draft_v1");if(old){var parsed=JSON.parse(old);if(parsed&&parsed.answers&&confirm("Du hast einen lokal gespeicherten Zwischenstand. Möchtest du ihn fortsetzen?")){state.answers=parsed.answers;state.index=Number(parsed.index)||0;state.phase="form";}}}catch(e){}
render();
})();
</script>
</body></html>
