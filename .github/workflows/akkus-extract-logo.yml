name: Extract Agentur Akkus Original Logo
on:
  push:
    paths:
      - '.github/workflows/akkus-extract-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse existing approved Agentur Akkus logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64
          src=Path('akkus-gasteltern-fragebogen/index.html').read_text()
          m=re.search(r'<span class="mark"><img src="data:image/png;base64,([A-Za-z0-9+/=]+)"',src)
          if not m: raise RuntimeError('Original logo not found in existing Agentur Akkus questionnaire')
          logo=base64.b64decode(m.group(1),validate=True)
          if not logo.startswith(b'\\x89PNG\\r\\n\\x1a\\n') or len(logo)<10000: raise RuntimeError('Original logo invalid')
          output=Path('akkus-freiwilligendienst-bewerbung/assets/agentur-akkus-logo.png')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_bytes(logo)
          print('Original Agency logo saved:',len(logo),'bytes')
          PY
      - name: Add logo asset
        run: |
          git config user.name 'Agentur Akkus Design'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akkus-freiwilligendienst-bewerbung/assets/agentur-akkus-logo.png
          if ! git diff --cached --quiet; then
            git commit -m 'Reuse original Agentur Akkus logo in volunteer applicant portal'
            git push
          fi
