name: Prepare Agentur Akkus Juna voice files
on:
  push:
    paths:
      - 'akkus-gasteltern-fragebogen/juna-assets.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Juna clips
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse
          root=pathlib.Path('akkus-gasteltern-fragebogen')
          data=json.loads((root/'juna-assets.json').read_text())
          target=root/'audio'
          target.mkdir(exist_ok=True)
          count=0
          for item in data:
            name=item['id']
            if not name.replace('-','').replace('_','').isalnum():
              raise ValueError('Invalid file name')
            url=item['url']
            if urllib.parse.urlparse(url).hostname != 'elevenlabsusercontent.com':
              raise ValueError('Unexpected audio host')
            path=target/(name+'.mp3')
            if path.exists() and path.stat().st_size>1000:
              continue
            req=urllib.request.Request(url,headers={'User-Agent':'AgenturAkkusAudioBuilder/1.0'})
            with urllib.request.urlopen(req,timeout=40) as res:
              audio=res.read()
              if res.status != 200 or len(audio)<1000: raise ValueError('Missing clip '+name)
            path.write_bytes(audio)
            print(name,len(audio))
            count+=1
          print('NEW FILES', count)
          PY
      - name: Publish permanent audio files to this repository
        shell: bash
        run: |
          git config user.name 'Akkus audio automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akkus-gasteltern-fragebogen/audio/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Add permanent Juna audio clips for interactive questionnaire'
            git push
          fi
